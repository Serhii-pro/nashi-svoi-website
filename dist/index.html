<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Наші свої — дизайн-концепція</title>
    <script src="theme.js"></script>
    <meta
      name="description"
      content="Дизайн-концепція сторінок допомоги військовим і дітям за наданими макетами."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="stylesheet" href="style.css?v=3" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#funds" aria-label="Наші свої — збори"
        ><img src="assets/logo.svg" alt="" width="48" height="48" /><span
          >наші свої<span class="domain">nashi-svoi.org</span></span
        ></a
      >
      <nav aria-label="Сторінки макета">
        <a href="#funds" data-page="funds">Збори</a
        ><a href="#viktor" data-page="viktor">Віктор</a
        ><a href="#children" data-page="children">Діти</a>
      </nav>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Темна тема"
        title="Увімкнути темну тему"
      >
        <span class="theme-sun" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            /></svg></span
        ><span class="theme-moon" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.4 13.4A8.5 8.5 0 0 1 10.6 3.6a8.5 8.5 0 1 0 9.8 9.8Z"
            /></svg
        ></span>
      </button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <a class="footer-brand" href="#funds"
        ><img src="assets/logo.svg" width="28" height="28" alt="" />наші свої</a
      ><span>nashi-svoi.org</span>
    </footer>
    <dialog
      id="notice"
      aria-labelledby="notice-title"
      aria-describedby="notice-description"
    >
      <button class="dialog-close icon-button" aria-label="Закрити" data-close>
        <span data-icon="close"></span></button
      ><span class="dialog-symbol" data-icon="heart"></span>
      <h2 id="notice-title"></h2>
      <p id="notice-description"></p>
      <button class="primary" data-close>Зрозуміло</button>
    </dialog>
    <script src="icons.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
